[package]
name = "ratelgit"
version = "0.1.0"
description = "A Git client for moving quickly between projects and worktrees"
license = "MIT"
repository = "https://github.com/likeratel/ratelgit"
edition = "2021"
rust-version = "1.94"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which avoids a Windows linker collision (rust-lang/cargo#8519).
name = "ratelgit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
dunce = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
# Keep symbol names (not debug info) so macOS crash reports show function names.
strip = "debuginfo"
