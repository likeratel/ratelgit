name: Verify desktop builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
          - name: macOS Apple Silicon
            runner: macos-15
          - name: Windows x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.30.2

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.3
          cache: pnpm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm check

      - name: Test frontend
        run: pnpm test

      - name: Install Chromium for frontend end-to-end tests
        run: pnpm exec playwright install chromium

      - name: Test frontend end to end
        run: pnpm test:e2e

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --locked

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      # Builds the installers to prove they build; nothing is uploaded or published.
      - name: Build desktop package
        run: pnpm tauri build -- --locked
