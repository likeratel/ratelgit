name: Release Windows installers

# A tag builds the Windows installers and attaches them to a draft GitHub Release. The macOS disk
# image is signed and notarized on a Mac with a Developer ID and uploaded to the same draft by hand,
# so this workflow needs no signing secrets. The Windows installers are not code signed.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Check tag matches app version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Compare tag with the version in every manifest
        shell: bash
        run: |
          set -euo pipefail
          tauri="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          package="$(node -p "require('./package.json').version")"
          cargo="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"
          for found in "$tauri" "$package" "$cargo"; do
            if [[ "${GITHUB_REF_NAME}" != "v${found}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${found} (tauri.conf.json ${tauri}, package.json ${package}, Cargo.toml ${cargo})."
              exit 1
            fi
          done

  windows:
    name: Build Windows x64 installers
    needs: preflight
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.30.2

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.3
          cache: pnpm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.94.1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers and attach them to the draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ratelgit ${{ github.ref_name }}
          releaseBody: Draft. The release notes and the macOS disk image are added before this is published.
          releaseDraft: true
          prerelease: false
